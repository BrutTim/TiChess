---
apiVersion: v1
kind: Service
metadata:
  name: view-service
  namespace: tichess
spec:
  selector:
    app: view-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: tichess
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
    spec:
      initContainers:
        - name: create-kafka-topics
          image: apache/kafka:3.9.1
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tichess.commands --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tichess.events --partitions 1 --replication-factor 1
      containers:
        - name: stream-service
          image: tichess:local
          imagePullPolicy: IfNotPresent
          env:
            - name: MAIN_CLASS
              value: ch.tichess.streaming.StreamServer
            - name: STREAM_SERVICE_PORT
              value: "8083"
            - name: CONTROLLER_SERVICE_URL
              value: http://controller-service:8082
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_COMMANDS_TOPIC
              value: tichess.commands
            - name: KAFKA_EVENTS_TOPIC
              value: tichess.events
            - name: KAFKA_CONSUMER_GROUP
              value: tichess-stream-service
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: tichess
spec:
  selector:
    app: stream-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tichess
  namespace: tichess
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/stream
            pathType: Prefix
            backend:
              service:
                name: stream-service
                port:
                  name: http
          - path: /api/kafka
            pathType: Prefix
            backend:
              service:
                name: stream-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: view-service
                port:
                  name: http
